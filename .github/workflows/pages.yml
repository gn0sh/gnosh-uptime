# Deploys the page shell (architecture §11, ADR-0005). Data refreshes never
# deploy: the page fetches status.json from the monitor-data branch at view
# time. The deploy job is gated by the github-pages environment (required
# reviewer: the owner; deployment branch rule: the default branch).
#
# Default branch: no branch name is hard-coded. Pushes to any branch start
# this workflow, and the build job runs only when the push (or manual run) is
# on the repository's current default branch. Today that is
# claude/project-thread-0jnua7; it keeps working unchanged once it is main.
# monitor.config.json is in the paths because siteName and the contact line
# are written into the page at build time (SC-7).
name: pages

on:
  push:
    branches-ignore:
      - monitor-data
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'monitor.config.json'
      - 'src/config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build _site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
