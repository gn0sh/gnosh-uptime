# Checks on every push and pull request (architecture §11): config validation
# (fails on config errors, AC-C6) and unit tests including the workflow lint.
# The monitor is an internal tool with no public status page, so there is no
# page build or accessibility job (ADR-0005, superseded).
# No path filter on purpose: "validate" is a required status check in the
# default-branch ruleset, and a path-filtered required check never reports.
name: validate

on:
  push:
    branches-ignore:
      - monitor-data
  pull_request:

permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate monitor.config.json
        run: node src/cli.js validate
      - name: Unit tests and workflow lint
        run: npm test
